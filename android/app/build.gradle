plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// =====================================================================
// MAYA BACKENDI AADRESS — APK-s EI OLE ÜHTEGI AADRESSI
// =====================================================================
// Avalik ehitus on TÜHJA vaikeväärtusega: kasutaja sisestab oma serveri
// aadressi esimesel käivitusel (ServerSetupActivity) ja see salvestub
// telefoni SharedPreferences'isse. `MAYA_DEFAULT_BASE_URL` on AINULT
// arendaja mugavus – väärtus eeltäidab seadistusvälja, ei ühenda ise.
//
//   avalik ehitus (kohustuslik):    ./gradlew assembleDebug
//   arendaja eeltäide (valikuline): ./gradlew assembleDebug \
//                                     -PmayaDefaultBaseUrl=<oma-server>
//   (emulaatori erijuht on kirjas docs/ANDROID.md-s)
//
// ÄRA pane siia ega gradle.properties-i püsivat aadressi, kui ehitad
// APK-d avalikuks levitamiseks.
def mayaDefaultBaseUrl = (project.findProperty('mayaDefaultBaseUrl') ?: '').toString().trim()
if (mayaDefaultBaseUrl.contains('"') || mayaDefaultBaseUrl.contains('\\')) {
    throw new GradleException("mayaDefaultBaseUrl sisaldab lubamatuid märke")
}

// =====================================================================
// VÄLJALASKE ALLKIRI
// =====================================================================
// Androidis EI SAA rakendust uuendada, kui uus APK on allkirjastatud
// teise võtmega: paigaldus kukub läbi veaga INSTALL_FAILED_UPDATE_
// INCOMPATIBLE ja kasutaja peab vana versiooni käsitsi eemaldama – koos
// kõigi seadetega. Seepärast PEAB allkirjastamisvõti olema püsiv.
//
// Võtit hoidlas EI OLE. See tuleb keskkonnamuutujatest, mille GitHub
// Actions täidab hoidla saladustest (vt .github/workflows/valjalase.yml).
//
// Kui muutujaid ei ole – tavaline kloon, fork, PR-ehitus – jääb
// signingConfig tekkimata ja `assembleRelease` annab ALLKIRJASTAMATA
// APK. See kompileerub (nii ei kuku CI läbi inimesel, kellel saladusi
// ei ole), aga seda ei saa telefoni paigaldada.
def ksBase64 = System.getenv('MAYA_KEYSTORE_BASE64')
def ksPass   = System.getenv('MAYA_KEYSTORE_PASSWORD')
def ksAlias  = System.getenv('MAYA_KEY_ALIAS')
def keyPass  = System.getenv('MAYA_KEY_PASSWORD')
def saabAllkirjastada = ksBase64?.trim() && ksPass && ksAlias && keyPass

// Arvutame väärtused SIIN, mitte android{} ploki sees.
//
// `versionCode (avaldis).toString().toInteger()` ei tee seda, mida ta
// paistab tegevat: Groovy seob sulud meetodikutsega, nii et teisendus
// rakendub versionCode'i TAGASTUSVÄÄRTUSELE ja setter saab Stringi.
// Sama lugu on `layout`-iga signingConfigs ploki sees, kus delegaat ei
// ole enam projekt.
def mayaVersionCode = (project.findProperty('mayaVersionCode') ?: '1').toString().toInteger()
def mayaVersionName = (project.findProperty('mayaVersionName') ?: '1.0').toString()
def ksFail = project.layout.buildDirectory.file("maya-release.jks").get().asFile

android {
    namespace 'com.maya.live'
    compileSdk 34

    defaultConfig {
        applicationId "com.maya.live"
        minSdk 26
        targetSdk 34
        // Androidi uuendus nõuab KASVAVAT versionCode'i. Väljalaskevoog
        // annab need lipuga kaasa (-PmayaVersionCode=… sildi põhjal);
        // tavaehitusel jääb 1.
        versionCode mayaVersionCode
        versionName mayaVersionName
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (saabAllkirjastada) {
            valjalase {
                // Dekodeeritakse ehituse kausta, MITTE lähtekoodi.
                // build/ on .gitignore'is, nii et võti ei saa commit'i sattuda.
                ksFail.parentFile.mkdirs()
                ksFail.bytes = ksBase64.trim().decodeBase64()
                storeFile ksFail
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [appLabel: "Maya Live"]
            buildConfigField "boolean", "ENABLE_WATCHER", "true"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: "Maya Live"]
            buildConfigField "boolean", "ENABLE_WATCHER", "true"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
            if (saabAllkirjastada) {
                signingConfig signingConfigs.valjalase
            }
        }
        // KATSEVERSIOON: paigaldub PÄRIS äpi KÕRVALE eraldi rakendusena
        // (applicationId com.maya.live.lab). Nii saab uut kujundust proovida,
        // ilma et töötav äpp muutuks.
        //
        // Valvur on siin VÄLJAS: CallWatcherService pollib /api/call_events
        // iga 3 s ja see on KUSTUTAV järjekord – kaks pollijat varastaksid
        // teineteiselt meeldetuletuskõnesid.
        lab {
            initWith debug
            applicationIdSuffix ".lab"
            versionNameSuffix "-lab"
            manifestPlaceholders = [appLabel: "Maya LAB"]
            buildConfigField "boolean", "ENABLE_WATCHER", "false"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
            matchingFallbacks = ["debug"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'

    // ServerConfig puhta loogika testid (./gradlew testDebugUnitTest).
    // JUnit jääb AINULT testide klassiteele – APK-sse ta ei satu.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
