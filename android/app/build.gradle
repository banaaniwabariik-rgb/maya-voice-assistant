plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// =====================================================================
// MAYA BACKENDI AADRESS — APK-s EI OLE ÜHTEGI AADRESSI
// =====================================================================
// Avalik ehitus on TÜHJA vaikeväärtusega: kasutaja sisestab oma serveri
// aadressi esimesel käivitusel (ServerSetupActivity) ja see salvestub
// telefoni SharedPreferences'isse. `MAYA_DEFAULT_BASE_URL` on AINULT
// arendaja mugavus – väärtus eeltäidab seadistusvälja, ei ühenda ise.
//
//   avalik ehitus (kohustuslik):    ./gradlew assembleDebug
//   arendaja eeltäide (valikuline): ./gradlew assembleDebug \
//                                     -PmayaDefaultBaseUrl=<oma-server>
//   (emulaatori erijuht on kirjas docs/ANDROID.md-s)
//
// ÄRA pane siia ega gradle.properties-i püsivat aadressi, kui ehitad
// APK-d avalikuks levitamiseks.
def mayaDefaultBaseUrl = (project.findProperty('mayaDefaultBaseUrl') ?: '').toString().trim()
if (mayaDefaultBaseUrl.contains('"') || mayaDefaultBaseUrl.contains('\\')) {
    throw new GradleException("mayaDefaultBaseUrl sisaldab lubamatuid märke")
}

android {
    namespace 'com.maya.live'
    compileSdk 34

    defaultConfig {
        applicationId "com.maya.live"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            manifestPlaceholders = [appLabel: "Maya Live"]
            buildConfigField "boolean", "ENABLE_WATCHER", "true"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: "Maya Live"]
            buildConfigField "boolean", "ENABLE_WATCHER", "true"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
        }
        // KATSEVERSIOON: paigaldub PÄRIS äpi KÕRVALE eraldi rakendusena
        // (applicationId com.maya.live.lab). Nii saab uut kujundust proovida,
        // ilma et töötav äpp muutuks.
        //
        // Valvur on siin VÄLJAS: CallWatcherService pollib /api/call_events
        // iga 3 s ja see on KUSTUTAV järjekord – kaks pollijat varastaksid
        // teineteiselt meeldetuletuskõnesid.
        lab {
            initWith debug
            applicationIdSuffix ".lab"
            versionNameSuffix "-lab"
            manifestPlaceholders = [appLabel: "Maya LAB"]
            buildConfigField "boolean", "ENABLE_WATCHER", "false"
            buildConfigField "String", "MAYA_DEFAULT_BASE_URL", "\"${mayaDefaultBaseUrl}\""
            matchingFallbacks = ["debug"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'

    // ServerConfig puhta loogika testid (./gradlew testDebugUnitTest).
    // JUnit jääb AINULT testide klassiteele – APK-sse ta ei satu.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
