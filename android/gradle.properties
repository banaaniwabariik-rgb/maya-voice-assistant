android.useAndroidX=true
android.enableJetifier=true

# =====================================================================
# MAYA BACKENDI AADRESS — SIIN SEDA EI OLE JA EI TOHIGI OLLA
# =====================================================================
# Avalik APK ei sisalda ÜHTEGI backendi aadressi. Kasutaja sisestab oma
# serveri aadressi rakenduse esimesel käivitusel ja see salvestatakse
# telefoni (SharedPreferences "maya_server" / "base_url").
#
# Arendajale on olemas VALIKULINE eeltäide, mis ainult täidab
# seadistusvälja ette ära – see ei ühenda ise kuhugi:
#
#   ./gradlew assembleDebug -PmayaDefaultBaseUrl=<oma-serveri-aadress>
#
# (Emulaatori erijuhtum on kirjas docs/ANDROID.md-s.)
#
# ÄRA lisa siia püsivat `mayaDefaultBaseUrl` rida, kui ehitad APK-d
# avalikuks levitamiseks: test `tests/tests_serveri_seadistus.py`
# kukub siis teadlikult läbi.
